name: KaigiApp
options:
  bundleIdPrefix: io.github.droidkaigi.confsched
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    # No Kotlin/Native target is configured for the Intel simulator (see docs/ios.md), so a Release
    # build — where ONLY_ACTIVE_ARCH is NO — must not ask Gradle's Swift Export for ios_x64.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  # Generated by :app-ios-kotlin's swiftPMDependencies. The exported Kotlin code loads this
  # package's dynamic product, KotlinMultiplatformLinkedPackageDylib, which Xcode embeds in the app
  # bundle only when the target links the package.
  KotlinMultiplatformLinkedPackage:
    path: KotlinMultiplatformLinkedPackage
targets:
  KaigiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - package: KotlinMultiplatformLinkedPackage
        product: KotlinMultiplatformLinkedPackage
      - target: FavoritesWidget
    info:
      path: KaigiApp-Info.plist
      properties:
        CFBundleDisplayName: DroidKaigi 2026
        CFBundleURLTypes:
          - CFBundleURLName: io.github.droidkaigi.confsched.deeplink
            CFBundleURLSchemes: [droidkaigi2026]
        # The single source for both values: every bundle taking part in the snapshot exchange
        # reads them back from its own Info.plist, and the entitlements below alias the same node.
        FavoritesWidgetAppGroup: &favoritesWidgetAppGroup group.io.github.droidkaigi.confsched.kaigiapp
        FavoritesWidgetSnapshotSchemaVersion: &favoritesWidgetSnapshotSchemaVersion 2
        # Shown when the timetable adds a session to the system calendar (EventKit write access).
        NSCalendarsUsageDescription: Sessions you choose are added to your calendar.
        # Required by Compose Multiplatform's PlistSanityCheck (it throws on launch otherwise).
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    preBuildScripts:
      - name: Embed Kotlin Swift Export Library
        # Gradle runs a nested xcodebuild for the generated Swift package, and that build reads the
        # inherited SWIFT_INCLUDE_PATHS; leaving it set makes the already-copied module maps in
        # BUILT_PRODUCTS_DIR collide with the ones the nested build is compiling.
        script: cd "$SRCROOT/.." && env -u SWIFT_INCLUDE_PATHS ./gradlew :app-ios-kotlin:embedSwiftExportForXcode
        basedOnDependencyAnalysis: false
      # Gradle never resolves Swift packages, so the licenses screen learns about them from the
      # iOS build; the app reads the result and hands it to KaigiAppHost.
      - name: Generate Swift Package Licenses
        script: "$SRCROOT/scripts/generate-swift-package-licenses.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.droidkaigi.confsched.kaigiapp
        GENERATE_INFOPLIST_FILE: NO
        # embedSwiftExportForXcode drops the .swiftmodule directories, the bridge module maps and
        # the static library into BUILT_PRODUCTS_DIR; the module maps sit one directory deep, hence
        # the recursive import path.
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)/**
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -lAppShared
        # The Gradle embed task writes into the build products; sandboxing breaks it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: KaigiApp.entitlements
      properties:
        com.apple.security.application-groups: [*favoritesWidgetAppGroup]
  # The home-screen widget. It links none of the exported Kotlin: the app writes it a snapshot into
  # the App Group both targets are entitled to, and the extension renders from that alone.
  FavoritesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FavoritesWidget/Sources
      - path: Shared
    info:
      path: FavoritesWidget/FavoritesWidget-Info.plist
      properties:
        CFBundleDisplayName: DroidKaigi 2026
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FavoritesWidgetAppGroup: *favoritesWidgetAppGroup
        FavoritesWidgetSnapshotSchemaVersion: *favoritesWidgetSnapshotSchemaVersion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.droidkaigi.confsched.kaigiapp.FavoritesWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: FavoritesWidget/FavoritesWidget.entitlements
      properties:
        com.apple.security.application-groups: [*favoritesWidgetAppGroup]
  # The extension's own sources, minus its entry point, compiled into a host-free test bundle.
  FavoritesWidgetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FavoritesWidget/Sources
        excludes:
          - FavoritesWidgetBundle.swift
      - path: FavoritesWidget/Tests
      - path: Shared
    info:
      path: FavoritesWidget/Tests/FavoritesWidgetTests-Info.plist
      properties:
        FavoritesWidgetAppGroup: *favoritesWidgetAppGroup
        FavoritesWidgetSnapshotSchemaVersion: *favoritesWidgetSnapshotSchemaVersion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.droidkaigi.confsched.kaigiapp.FavoritesWidgetTests
        GENERATE_INFOPLIST_FILE: NO
schemes:
  # The pre-build "Embed Kotlin Swift Export Library" phase forwards Xcode's CONFIGURATION to
  # embedSwiftExportForXcode, and the Kotlin Gradle plugin maps Debug/Release onto the debug/release
  # Kotlin/Native link. The scheme's per-action configuration is therefore what selects the variant
  # of the exported AppShared static library.
  KaigiApp:
    build:
      targets:
        KaigiApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KaigiApp Release:
    build:
      targets:
        KaigiApp: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  FavoritesWidgetTests:
    build:
      targets:
        FavoritesWidgetTests: [test]
    test:
      targets:
        - FavoritesWidgetTests

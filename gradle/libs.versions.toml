# Version catalog — the single source of truth for dependency + plugin versions across all modules.
# Aliases follow the 2025 app convention: flat camelCase (one accessor segment under `libs.`).
[versions]
kotlin = "2.4.0"
jetbrainsCompose = "1.12.0-beta02"
metro = "1.2.1"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kotlinxCollectionsImmutable = "0.5.0"
kotlinxBrowser = "0.5.0"
# Time zones and date-time formatting. Instant/Clock themselves are stdlib (kotlin.time) since
# Kotlin 2.3, and kotlinx-datetime 0.7.0 turned its own copies into deprecated type aliases.
kotlinxDatetime = "0.8.0"
soil = "1.0.0-alpha15"
molecule = "2.2.0"
androidxDatastore = "1.3.0-alpha09"
okio = "3.16.4"
turbine = "1.2.1"
composeRuntimeRetain = "1.12.0-alpha03"
androidxNavigation3 = "1.1.1"
androidxLifecycle = "2.9.6"
# Material3 adaptive list-detail SceneStrategy for Navigation3 (regular Maven Central release).
composeMaterial3AdaptiveNavigation3 = "1.3.0-beta02"
agp = "9.2.1"
androidxActivityCompose = "1.10.1"
androidxCore = "1.16.0"
# Jetpack Glance home-screen widget framework (app-android only).
androidxGlance = "1.2.0-rc01"
androidxWork = "2.10.5"
# KSP 2.3.x is decoupled from the Kotlin compiler version (KSP2 standalone Analysis-API backend), so a
# single 2.3.x release runs against Kotlin 2.4.0.
ksp = "2.3.9"
kotlinPoet = "2.3.0"
buildkonfig = "0.22.0"
# Coil 3's network fetcher artifact (coil-network-ktor3) is only published at 3.2.0 in this stack, so
# pin every Coil module to 3.2.0 to keep coil-core consistent across compose + network artifacts.
coil = "3.2.0"
# The JetWhale agent runtime requires 3.5.2, which conflict resolution would raise this to anyway;
# declaring it keeps the catalog reading as what actually resolves.
ktor = "3.5.2"
# Debug agent, wired into dev builds only.
jetwhale = "1.0.0-alpha11"
# Compose Multiplatform the targeted JetWhale host release itself was built with.
jetwhaleHostCompose = "1.11.1"
# Single source of truth for the app version; flows to common Kotlin via the generated BuildKonfig.
droidkaigiApp = "1.1.0"
# KMP logger with platform-native writers (Logcat / os_log / SLF4J / console), wasmJs-capable.
kermit = "2.1.0"
# QR encoder used for the profile card's back face; only its module matrix is consumed, the drawing
# stays in the app's own Canvas code.
qrcodeKotlin = "4.5.0"
# Retrofit-style declarative HTTP clients over Ktor (KSP-generated implementations).
ktorfit = "2.7.5"
# Collects the open source dependencies of each platform entry module and their licenses; the Gradle
# plugin and the runtime parser share one version.
aboutlibraries = "15.0.4"
# Generates the Ktorfit API surface from openapi/openapi.yml via custom Mustache templates.
openapiGenerator = "7.14.0"
# YAML parser used by the trimOpenApiSpec convention task (gradle-conventions only).
kaml = "0.104.0"
# Preview screenshot-test stack (JVM target — see docs/testing-preview-screenshot.md).
# Roborazzi renders @Preview composables on the Compose Desktop (JVM) target; ComposablePreviewScanner
# discovers them.
roborazzi = "1.70.0"
composablePreviewScanner = "0.9.1"
junit = "4.13.2"
# Formatting: Spotless drives ktlint. The ktlint version is pinned here rather than left to
# Spotless's default so an upgrade is a deliberate, reviewable change to the formatting baseline.
spotless = "8.8.0"
ktlint = "1.8.0"
# Relocates com.intellij into the org.jetbrains.kotlin.com.intellij namespace the Kotlin Gradle
# plugin's embeddable compiler expects — see tools/compiler-plugin/build.gradle.kts.
shadow = "9.6.1"

[libraries]
composeRuntimeRetain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "composeRuntimeRetain" }
navigation3Runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
navigation3Ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
lifecycleRuntimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
composeMaterial3AdaptiveNavigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "composeMaterial3AdaptiveNavigation3" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxCollectionsImmutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinxBrowser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
soilQueryCore = { module = "com.soil-kt.soil:query-core", version.ref = "soil" }
soilQueryCompose = { module = "com.soil-kt.soil:query-compose", version.ref = "soil" }
soilReacty = { module = "com.soil-kt.soil:reacty", version.ref = "soil" }
molecule = { module = "app.cash.molecule:molecule-runtime", version.ref = "molecule" }
# Compose Multiplatform UI test — provides the multiplatform runComposeUiTest/ComposeUiTest. The
# desktop(JVM) actual ships in this same artifact, so the Robot layer needs no ui-test-junit4. Same
# coordinate the `compose.uiTest` DSL accessor resolves to; pinned to the Compose MPP version.
composeUiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "jetbrainsCompose" }
composeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrainsCompose" }
composeFoundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrainsCompose" }
composeUi = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetbrainsCompose" }
composeComponentsResources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "jetbrainsCompose" }
composeUiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "jetbrainsCompose" }
composeUiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "jetbrainsCompose" }
# Material3 is versioned independently of the Compose Multiplatform release.
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version = "1.12.0-alpha03" }
androidxDatastoreCore = { module = "androidx.datastore:datastore-core", version.ref = "androidxDatastore" }
androidxDatastorePreferencesCore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidxDatastore" }
androidxDatastoreCoreOkio = { module = "androidx.datastore:datastore-core-okio", version.ref = "androidxDatastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidxCore = { module = "androidx.core:core", version.ref = "androidxCore" }
androidxGlanceAppwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidxGlance" }
androidxGlancePreview = { module = "androidx.glance:glance-preview", version.ref = "androidxGlance" }
androidxGlanceAppwidgetPreview = { module = "androidx.glance:glance-appwidget-preview", version.ref = "androidxGlance" }
androidxWorkRuntime = { module = "androidx.work:work-runtime", version.ref = "androidxWork" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinCompiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
kotlinCompilerInternalTestFramework = { module = "org.jetbrains.kotlin:kotlin-compiler-internal-test-framework", version.ref = "kotlin" }
kotlinTestJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
# Un-shaded Compose compiler plugin, registered inside the compiler test framework so @Composable
# function types resolve the same way they do in the app build.
kotlinComposeCompilerPlugin = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin", version.ref = "kotlin" }
# Resolved to absolute jar paths and handed to the compiler test framework via system properties.
kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinStdlibJdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinScriptRuntime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "kotlin" }
kotlinAnnotationsJvm = { module = "org.jetbrains.kotlin:kotlin-annotations-jvm", version.ref = "kotlin" }
kspSymbolProcessingApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinPoetKsp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinPoet" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilNetworkKtor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorClientJs = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktorClientDarwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorfitLib = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
ktorfitKsp = { module = "de.jensklingenberg.ktorfit:ktorfit-ksp", version.ref = "ktorfit" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
qrcodeKotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcodeKotlin" }
aboutlibrariesCore = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }
# Ready-made Material 3 list, detail expansion and license dialog over the collected libraries.
aboutlibrariesComposeM3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
jetwhaleAgentRuntime = { module = "com.kitakkun.jetwhale:jetwhale-agent-runtime", version.ref = "jetwhale" }
jetwhaleNav3Agent = { module = "com.kitakkun.jetwhale:jetwhale-nav3-agent", version.ref = "jetwhale" }
# Carries the network agent core (JetWhaleNetworkAgentPlugin) as an api dependency.
jetwhaleNetworkInspectorAgentKtor = { module = "com.kitakkun.jetwhale:jetwhale-network-inspector-agent-ktor", version.ref = "jetwhale" }
jetwhaleComposeSemanticsInspectorAgent = { module = "com.kitakkun.jetwhale:jetwhale-compose-semantics-inspector-agent", version.ref = "jetwhale" }
# Building the app's own JetWhale plugin: shared message markers, the agent base class, and the
# host-side SDK the desktop half compiles against.
jetwhaleProtocolCore = { module = "com.kitakkun.jetwhale:jetwhale-protocol-core", version.ref = "jetwhale" }
jetwhaleAgentSdk = { module = "com.kitakkun.jetwhale:jetwhale-agent-sdk", version.ref = "jetwhale" }
jetwhaleHostSdk = { module = "com.kitakkun.jetwhale:jetwhale-host-sdk", version.ref = "jetwhale" }
# The JetWhale host provides Compose at runtime, so the host plugin compiles against the versions
# that host release ships rather than the app's own (newer) Compose Multiplatform.
jetwhaleHostComposeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetwhaleHostCompose" }
jetwhaleHostComposeFoundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetwhaleHostCompose" }
jetwhaleHostComposeUi = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetwhaleHostCompose" }
jetwhaleHostComposeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version = "1.11.0-alpha07" }
firebaseCrashlytics = { module = "com.google.firebase:firebase-crashlytics", version = "20.1.0" }
androidxFragment = { module = "androidx.fragment:fragment", version = "1.9.0" }
roborazziComposeDesktop = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop", version.ref = "roborazzi" }
roborazziDesktopPreviewScannerSupport = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop-preview-scanner-support", version.ref = "roborazzi" }
# The :android artifact scans androidx.compose.ui.tooling.preview.Preview, which is the annotation
# Compose Multiplatform previews carry.
composablePreviewScannerAndroid = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "jetbrainsCompose" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
googleServices = { id = "com.google.gms.google-services", version = "4.5.0" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
# Separate plugin id: it registers the per-Android-variant tasks and feeds their output into the
# variant's generated resources.
aboutlibrariesAndroid = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# Carries the Kotlin compiler plugin that rewrites buildMachineWss(); same version as the agent
# runtime it rewrites the call into.
jetwhaleAgent = { id = "com.kitakkun.jetwhale.agent", version.ref = "jetwhale" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
jetwhaleHost = { id = "com.kitakkun.jetwhale.host", version.ref = "jetwhale" }
# Local convention plugins (gradle-conventions included build); the version is never resolved —
# includeBuild substitution wins — but the catalog schema requires one.
droidkaigiPrimitiveKmp = { id = "droidkaigi.primitive.kmp", version = "unspecified" }
droidkaigiPrimitiveOpenapi = { id = "droidkaigi.primitive.openapi", version = "unspecified" }
droidkaigiPrimitiveIcons = { id = "droidkaigi.primitive.icons", version = "unspecified" }
droidkaigiPrimitiveKmpCompose = { id = "droidkaigi.primitive.kmp.compose", version = "unspecified" }
droidkaigiPrimitiveBuildkonfig = { id = "droidkaigi.primitive.buildkonfig", version = "unspecified" }
droidkaigiPrimitiveSpotless = { id = "droidkaigi.primitive.spotless", version = "unspecified" }
droidkaigiPrimitiveLicensesExport = { id = "droidkaigi.primitive.licenses-export", version = "unspecified" }
droidkaigiPrimitiveEnforcement = { id = "droidkaigi.primitive.enforcement", version = "unspecified" }
droidkaigiConventionKmpFeature = { id = "droidkaigi.convention.kmp-feature", version = "unspecified" }

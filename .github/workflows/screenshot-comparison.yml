name: Screenshot comparison

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - '**/src/**/composeResources/**'
      - 'gradle/wrapper/**'
      - '.github/workflows/screenshot-comparison.yml'

concurrency:
  group: screenshot-comparison-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read # for clone
      actions: write # for upload-artifact, and for downloading the base branch artifact

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The goldens come from the base commit, so the report shows what this pull request changed
      # rather than what the base branch has moved on to.
      - name: Download the goldens recorded on the base commit
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: screenshot-goldens
          workflow: test.yml
          commit: ${{ github.event.pull_request.base.sha }}
          if_no_artifact_found: fail
      # The Test workflow is path-filtered, so a base commit that touched nothing it watches has no
      # artifact of its own. Comparing against the newest goldens on the branch beats not reporting.
      - name: Fall back to the newest goldens on the base branch
        if: steps.baseline.outcome == 'failure'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: screenshot-goldens
          workflow: test.yml
          branch: ${{ github.base_ref }}
          workflow_conclusion: success
          if_no_artifact_found: fail

      - name: Render this pull request and compare
        run: ./gradlew compareRoborazziJvm --continue

      - name: Upload diff reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diff-reports
          path: '**/build/outputs/roborazzi'
          retention-days: 30

      # The commenting workflow runs on workflow_run, where the pull request number is not part of
      # the event payload.
      - name: Save the pull request number for the commenting workflow
        run: |
          mkdir -p pr
          echo "${{ github.event.number }}" > pr/NR
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr
          path: pr/
          retention-days: 1

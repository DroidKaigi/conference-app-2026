name: Screenshot comparison comment

# Runs on workflow_run so that the write permissions a comment needs are never granted to the
# workflow that builds a pull request's own code.
on:
  workflow_run:
    workflows:
      - Screenshot comparison
    types:
      - completed

concurrency:
  group: screenshot-comparison-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read # for downloading the diff artifacts
      contents: write # for pushing the diff images to the companion branch
      pull-requests: write # for the comment itself

    env:
      COMPANION_BRANCH: companion_${{ github.event.workflow_run.head_branch }}

    steps:
      - uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: pr
          run_id: ${{ github.event.workflow_run.id }}
      - id: pull-request
        run: |
          # Everything downloaded here was produced by a run of the pull request's own code, so it
          # is treated as untrusted input.
          number=$(tr -dc '0-9' < NR | head -c 10)
          [ -n "$number" ] || { echo "::error::no pull request number in the artifact"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # A comment can only embed an image that is reachable over HTTP, so the diffs are pushed to a
      # branch of their own. It is orphaned so the images never enter main's history.
      - name: Start an empty companion branch
        run: |
          git checkout --orphan "$COMPANION_BRANCH"
          git rm -rf --quiet .

      - uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          name: screenshot-diff-reports
          run_id: ${{ github.event.workflow_run.id }}
          path: screenshot-diff-reports

      # Roborazzi writes a _compare.png only where the render differs from the golden, so an empty
      # list means the pull request changed nothing on screen.
      - id: collect
        name: Collect the diff images
        run: |
          # A screenshot id is built from a qualified function name, so anything outside the
          # roborazzi output directories or carrying an unexpected character did not come from
          # Roborazzi and is dropped rather than committed and linked.
          mapfile -d '' -t found < <(find screenshot-diff-reports -type f -name '*_compare.png' -print0)
          : > files.txt
          for file in "${found[@]}"; do
            case "$file" in
              */build/outputs/roborazzi/*) ;;
              *) continue ;;
            esac
            [[ "$file" =~ ^[A-Za-z0-9._/-]+$ ]] && printf '%s\n' "$file" >> files.txt
          done
          echo "count=$(wc -l < files.txt)" >> "$GITHUB_OUTPUT"

      - name: Push the diff images
        if: steps.collect.outputs.count != '0'
        run: |
          xargs -a files.txt -d '\n' git add --
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Screenshot diff for ${{ github.event.workflow_run.head_branch }}"
          git push --force origin "HEAD:$COMPANION_BRANCH"

      # find-comment runs first and unconditionally: a pull request whose diffs have since been
      # fixed produces no image, and the report it was given earlier has to say so rather than
      # stand as the last word.
      - uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: existing
        with:
          issue-number: ${{ steps.pull-request.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Snapshot diff report

      - id: report
        name: Build the report
        if: steps.collect.outputs.count != '0' || steps.existing.outputs.comment-id != ''
        # A comment body over 65536 characters is rejected by the API, so a wide-reaching change
        # lists this many renders and leaves the rest to the companion branch.
        env:
          MAX_ROWS: 50
        run: |
          {
            echo "Snapshot diff report"
            echo
          } > comment.md
          if [ "${{ steps.collect.outputs.count }}" = "0" ]; then
            echo "No preview renders differ from the base branch." >> comment.md
          else
            mapfile -t files < files.txt
            {
              echo "| File name | Image |"
              echo "|-------|-------|"
            } >> comment.md
            # Screenshot ids are built from the qualified function name, so a path needs no escaping.
            for file in "${files[@]:0:MAX_ROWS}"; do
              # Long ids overflow the column, so the name wraps every 20 characters.
              name=$(basename "$file" | sed -r 's/(.{20})/\1<br>/g')
              url="https://github.com/${{ github.repository }}/blob/$COMPANION_BRANCH/$file"
              echo "| [$name]($url) | ![]($url?raw=true) |" >> comment.md
            done
            if [ "${#files[@]}" -gt "$MAX_ROWS" ]; then
              tree="https://github.com/${{ github.repository }}/tree/$COMPANION_BRANCH"
              echo >> comment.md
              echo "$(( ${#files[@]} - MAX_ROWS )) further renders differ. Browse them on [$COMPANION_BRANCH]($tree)." >> comment.md
            fi
          fi

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: steps.report.outcome == 'success'
        with:
          comment-id: ${{ steps.existing.outputs.comment-id }}
          issue-number: ${{ steps.pull-request.outputs.number }}
          # The report is handed over as a file: a long one overflows the process argument list.
          body-path: comment.md
          edit-mode: replace

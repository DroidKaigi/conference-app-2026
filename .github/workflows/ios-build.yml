name: iOS build

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - '**/*.toml'
      - 'app-ios/**'
      - 'gradle/wrapper/**'
      - '.github/actions/setup-java/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - '**/*.toml'
      - 'app-ios/**'
      - 'gradle/wrapper/**'
      - '.github/actions/setup-java/**'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Drives the whole iOS build the way a developer does: Xcode's pre-build script runs Gradle's
  # Swift Export, and Xcode then compiles the generated Swift, links it and packages the app. A
  # Gradle-only check would cover neither the generated Swift sources nor the real build settings.
  # Kotlin/Native needs an Apple host to compile Apple targets, hence macos-latest instead of ubuntu.
  xcodebuild:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      # The system appearance an app gets is decided by the SDK it links against, so the iOS 26 SDK
      # is what makes the tab bar render as Liquid Glass; the image's default Xcode may predate it.
      # Betas are excluded: linking iOS or syncing Gradle under a beta Xcode fails with exit 65, and
      # the images carry a beta alongside the release for months.
      - name: Select the newest installed release Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv beta | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select --switch "$newest/Contents/Developer"; fi
          xcodebuild -version
      # A generic/platform=iOS Simulator destination resolves to x86_64, which no Kotlin target is
      # configured for; naming one of the runner's own simulators pins the build to arm64.
      # python3 comes with the Xcode toolchain this job already selects, so parsing the device list
      # needs no install step of its own.
      - name: Resolve an iOS Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]
          iphones = [
              device
              for runtime, group in devices.items() if "SimRuntime.iOS" in runtime
              for device in group if device["name"].startswith("iPhone")
          ]
          print(iphones[-1]["udid"] if iphones else "")
          ')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator is available on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # SWIFT_INCLUDE_PATHS is deliberately left unset here: Xcode exports it to the pre-build
      # script, which unsets it again for the nested Gradle build, and a value inherited from the
      # environment would reach that build through a path the script does not cover.
      - name: Build the iOS app
        run: |
          xcodebuild build \
            -project app-ios/KaigiApp.xcodeproj \
            -scheme KaigiApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

name: Test

on:
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.toml'
      - '**/*.properties'
      - '**/src/**/resources/**'
      - 'core/data/openapi/**'
      - 'gradle/wrapper/**'
      - '.github/actions/setup-java/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.toml'
      - '**/*.properties'
      - '**/src/**/resources/**'
      - 'core/data/openapi/**'
      - 'gradle/wrapper/**'
      - '.github/actions/setup-java/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs on a host JVM: the JVM-only modules, every multiplatform module's JVM
  # target, and :app-android's unit-test variants. The preview screenshot tests also live in the
  # feature modules' jvmTest, but recording goldens is the screenshot-goldens job's task below.
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      # --continue reports every failing module in one run.
      - name: Run unit tests
        run: ./gradlew test jvmTest --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # Records the goldens every pull request is compared against, rather than asserting anything.
  # Pull requests render their own in the screenshot-comparison workflow, so this only needs to run
  # once per commit on main.
  screenshot-goldens:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # for clone
      actions: write # for upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - name: Record preview screenshots
        run: ./gradlew recordRoborazziJvm --continue
      - name: Upload goldens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-goldens
          path: '**/build/outputs/roborazzi'
          retention-days: 30

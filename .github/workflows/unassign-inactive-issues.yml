name: Unassign inactive issues

on:
  schedule:
    - cron: '17 * * * *' # Deadlines are announced as absolute times; an hourly check keeps removals close to them. Minute 17 avoids the congested top of the hour.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'When true, log intended actions without posting comments or unassigning'
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: read

jobs:
  unassign-inactive-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PRIORITY_DAYS = [
              { label: 'priority:high 🔥', remind: 2, unassign: 3 },
              { label: 'priority:medium ⏳', remind: 3, unassign: 4 },
              { label: 'priority:low 🐢', remind: 4, unassign: 5 },
            ]
            const MS_PER_DAY = 24 * 60 * 60 * 1000

            function thresholdsFor(issue) {
              const names = new Set(
                (issue.labels ?? []).map((label) => (typeof label === 'string' ? label : label.name))
              )
              const matched = PRIORITY_DAYS.filter((tier) => names.has(tier.label))
              // Issues awaiting triage carry no priority label; they must not idle on a looser
              // schedule than triaged ones, so unlabeled (and conflicting) issues take the
              // strictest applicable tier.
              const candidates = matched.length > 0 ? matched : PRIORITY_DAYS
              return candidates.reduce((a, b) => (a.unassign <= b.unassign ? a : b))
            }

            const input = context.payload.inputs?.dry_run
            const dryRun = context.eventName === 'workflow_dispatch'
              ? input !== false && input !== 'false'
              : false
            core.info(`dry_run=${dryRun}`)

            const { owner, repo } = context.repo
            const now = Date.now()

            const reminderMarker = (login, unassignDays) => `<!-- stale-reminder:${login}:${unassignDays} -->`
            // Reminders posted before thresholds became label-dependent omit the day count
            // from the marker; they promised the then-fixed 3-day window.
            const LEGACY_PROMISED_DAYS = 3

            const formatUtc = (date) => `${date.toISOString().slice(0, 16).replace('T', ' ')} UTC`

            async function openLinkedPullRequestAuthors(timeline) {
              const prNumbers = new Set()
              for (const event of timeline) {
                if (
                  event.event === 'cross-referenced' &&
                  event.source?.issue?.pull_request &&
                  event.source.issue.repository?.full_name === `${owner}/${repo}`
                ) {
                  prNumbers.add(event.source.issue.number)
                }
              }

              const authors = new Set()
              for (const prNumber of prNumbers) {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber })
                if (pr.state === 'open' && pr.user?.login) {
                  authors.add(pr.user.login)
                }
              }
              return authors
            }

            function lastAssignedAt(timeline, login) {
              const assignedEvents = timeline
                .filter((event) => event.event === 'assigned' && event.assignee?.login === login)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              return assignedEvents.length > 0
                ? new Date(assignedEvents[assignedEvents.length - 1].created_at)
                : null
            }

            function lastCommentAt(comments, login) {
              const own = comments
                .filter((comment) => comment.user?.login === login)
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              return own.length > 0 ? new Date(own[own.length - 1].created_at) : null
            }

            function latestReminder(comments, login, lastActivity) {
              const pattern = new RegExp(`<!-- stale-reminder:${login}(?::(\\d+))? -->`)
              let latest = null
              for (const comment of comments) {
                const match = pattern.exec(comment.body ?? '')
                if (!match) continue
                const createdAt = new Date(comment.created_at)
                if (createdAt <= lastActivity) continue
                if (!latest || createdAt > latest.createdAt) {
                  latest = {
                    createdAt,
                    promisedDays: match[1] ? Number(match[1]) : LEGACY_PROMISED_DAYS,
                  }
                }
              }
              return latest
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              assignee: '*',
              per_page: 100,
            })

            for (const issue of issues) {
              if (issue.pull_request) continue
              if (!issue.assignees || issue.assignees.length === 0) continue

              const { remind: remindAfterDays, unassign: unassignAfterDays } = thresholdsFor(issue)

              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })

              const linkedPrAuthors = await openLinkedPullRequestAuthors(timeline)

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })

              for (const assignee of issue.assignees) {
                const login = assignee.login
                if (linkedPrAuthors.has(login)) {
                  core.info(`#${issue.number}: ${login} has an open linked pull request, skipping`)
                  continue
                }
                // An assignment can land long after the comment that requested it, so take whichever is later.
                const lastActivity = new Date(
                  Math.max(
                    lastCommentAt(comments, login)?.getTime() ?? 0,
                    lastAssignedAt(timeline, login)?.getTime() ?? 0,
                    new Date(issue.created_at).getTime()
                  )
                )
                const daysSince = (now - lastActivity.getTime()) / MS_PER_DAY
                const reminder = latestReminder(comments, login, lastActivity)
                // Relabeling can shrink the window after the last reminder, or move the deadline
                // into the past before any reminder went out. A removal must be preceded by a
                // reminder that promised the current (or a stricter) window and is at least one
                // day old, so the assignee always gets a warning and a full day to react.
                const warned = reminder && reminder.promisedDays <= unassignAfterDays

                async function postReminder(lead) {
                  const removalAt = new Date(
                    Math.max(lastActivity.getTime() + unassignAfterDays * MS_PER_DAY, now + MS_PER_DAY)
                  )
                  if (!dryRun) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `@${login} ${lead} Unless there is further activity, the assignment will be removed after **${formatUtc(removalAt)}**. If you're still working on it, please leave a comment (opening a draft pull request also counts).\n${reminderMarker(login, unassignAfterDays)}`,
                    })
                  }
                }
                const windowChangedLead = `This issue now has a ${unassignAfterDays}-day inactivity window based on its priority.`

                if (daysSince >= unassignAfterDays) {
                  if (!warned) {
                    core.info(`#${issue.number}: announcing the ${unassignAfterDays}d window to ${login} (idle ${daysSince.toFixed(1)}d)`)
                    await postReminder(windowChangedLead)
                    continue
                  }
                  const reminderAgeDays = (now - reminder.createdAt.getTime()) / MS_PER_DAY
                  if (reminderAgeDays < 1) {
                    core.info(`#${issue.number}: ${login} was reminded ${reminderAgeDays.toFixed(1)}d ago, deferring the removal`)
                    continue
                  }
                  core.info(`#${issue.number}: unassigning ${login} (idle ${daysSince.toFixed(1)}d, threshold ${unassignAfterDays}d)`)
                  if (!dryRun) {
                    await github.rest.issues.removeAssignees({
                      owner,
                      repo,
                      issue_number: issue.number,
                      assignees: [login],
                    })
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `@${login} This issue has been inactive for ${unassignAfterDays}+ days, so the assignment has been removed. If you'd like to continue working on it, comment 🙋 to get assigned again.`,
                    })
                  }
                } else if (daysSince >= remindAfterDays) {
                  if (reminder && reminder.promisedDays === unassignAfterDays) {
                    core.info(`#${issue.number}: ${login} already reminded, skipping`)
                    continue
                  }
                  // The window changed in either direction since the last reminder; announce
                  // the new deadline once the current remind threshold is reached.
                  if (reminder) {
                    core.info(`#${issue.number}: announcing the ${unassignAfterDays}d window to ${login} (idle ${daysSince.toFixed(1)}d)`)
                    await postReminder(windowChangedLead)
                    continue
                  }
                  core.info(`#${issue.number}: reminding ${login} (idle ${daysSince.toFixed(1)}d, threshold ${remindAfterDays}d)`)
                  await postReminder(`This issue has had no activity for ${remindAfterDays} days.`)
                }
              }
            }

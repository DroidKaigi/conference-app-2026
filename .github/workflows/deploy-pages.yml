name: Deploy Pages

# No paths filter: the app build depends on nearly every module, so any push to main
# can change the deployed site.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # VitePress lastUpdated needs full commit history to report accurate per-page dates.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        run: npm run docs:build
      - uses: ./.github/actions/setup-java
      - name: Build web app
        run: ./gradlew :app-web:wasmJsBrowserDistribution
      - name: Stage Pages artifact
        # A Pages deployment replaces the whole site, so the app (site root) and the
        # docs (docs/) must ship in the same artifact.
        run: |
          mkdir -p dist/docs
          cp -r app-web/build/dist/wasmJs/productionExecutable/. dist/
          cp -r docs-site/.vitepress/dist/. dist/docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
